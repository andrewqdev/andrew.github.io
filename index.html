<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"  content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="choice.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">

    <title> Personagem</title>
</head>
<body>

    <!-- PÁGINA 1 DE ESCOLHA DO AVATAR -->
<section id="choiceavatar">
    <div>
        <h1> ESCOLHA SEU AVATAR: </h1>
    </div>


    <div>
        <table border="1" colspan="4" id="dustin">

            <tr>
                <th class="name">
                    DUSTIN
                </th>
            </tr>

            <tr>
                <th colspan="4">
                    <img class="imgdustin" src="./images/imgdustin.jpg">
                </th>
            </tr>

            <tr>
                    <th colspan="4" class="xp"> XP: 0/200 </th>
                </tr>

                <tr>
                    <th colspan="4"> 
                        <div class="barra-fora">
                            <div   class="barra-dentro"> </div>
                                    </div>
                    </th>
                </tr>

            <tr>
                <th colspan="4" class="atributos">ATRIBUTOS:</th>
            </tr>

            <tr>
                <th colspan="4"> INTELIGENTE </th>
            </tr>

            <tr>
                <th colspan="4"> AVENTUREIRO </th>
            </tr>

            <tr>
                <th colspan="4"> EXPLORADOR </th>
            </tr>


            <table border="1" colspan="4" id="eddie">


                <tr>
                    <th class="name">
                        EDDIE
                    </th>
                </tr>

                <tr>
                    <th colspan="4"> 
                        <img class="imgeddie" src="./images/imgeddie.jpg" alt="Eddie">
                    </th>
                </tr>

                <tr>
                    <th colspan="4" class="xp"> XP: 0/200 </th>
                </tr>

                <tr>
                    <th colspan="4"> 
                        <div class="barra-fora">
                            <div   class="barra-dentro"> </div>
                                    </div>
                    </th>
                </tr>

                <tr>
                    <th colspan="4" class="atributos"> ATRIBUTOS:</th>
                </tr>
                <tr>
                    <th colspan="4"> CORAJOSO </th>
                </tr>

                <tr>
                    <th colspan="4"> VALENTE </th>
                </tr>

                <tr>
                    <th colspan="4"> HERÓI </th>
                </tr>

            </table>

            <table border="1" colspan="4" id="gorgon">

                <tr>
                    <th colspan="4" class="name">
                         GORGON 
                    </th>
                </tr>
                    
                <tr>
                    <th colspan="4">
                        <img class="imggorgon" src="./images/imgorgon.jpg" alt="Gorgon">
                    </th>
                </tr>

                <tr>
                    <th colspan="4" class="xp"> XP: 0/200 </th>
                </tr>

                <tr>
                    <th colspan="4"> 
                        <div class="barra-fora">
                            <div   class="barra-dentro"> </div>
                                    </div>
                    </th>
                </tr>

                <tr>
                    <th colspan="4" class="atributos"> ATRIBUTOS: </th>
                </tr>

                <tr>
                    <th colspan="4"> FEROZ </th>
                </tr>

                <tr>
                    <th colspan="4"> VORAZ </th>
                </tr>

                <tr>
                    <th colspan="4"> RÁPIDO </th>
                </tr>

            </table>

        </table>
    </div>


</body>
</html>
